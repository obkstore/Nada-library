# Netlify config for the API service.
# NOTE: the base directory is set in the Netlify UI (NOT here), so all paths
# below are relative to that base directory.
[build]
  functions = "netlify/functions"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
